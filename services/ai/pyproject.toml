# ===========================================================================
# ai — service-local tooling configuration.
#
# The root pyproject.toml configures the platform only (it excludes
# services/), so this file is what `ruff`, `mypy` and `pytest` read when CI
# runs them inside services/ai/. Dependencies live in requirements*.txt, per
# the brief: pip only, no Poetry, no uv.
# ===========================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "S", "RUF", "ASYNC"]
ignore = [
    "E501",   # line length is the formatter's job
    "RUF001", # ambiguous unicode: Persian text and digits are the point here
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
exclude = "^(\\.venv|build)/"

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["sentence_transformers.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: needs a real model provider; deselected by default (`-m 'not network'`)",
]
filterwarnings = [
    # fakeredis passes a deprecated argument to redis-py. Not ours to fix, and
    # it would otherwise bury a warning that is.
    "ignore:Call to '__init__' function with deprecated usage:DeprecationWarning:fakeredis.aioredis",
]
