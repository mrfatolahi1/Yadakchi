# ---------------------------------------------------------------------------
# yadakchi — Prometheus scrape configuration
#
# Every Python service exposes /metrics (django-prometheus or the FastAPI
# instrumentator); web exposes /api/metrics. Targets are listed statically
# because the service set is fixed at ten and changes only with a spec change.
#
# A target that is not up yet simply shows as down — that is the intended
# signal while services are still being built, not a misconfiguration.
# ---------------------------------------------------------------------------
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: yadakchi
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: yadakchi-services
    metrics_path: /metrics
    static_configs:
      - targets: [ai:8000]
        labels: { service: ai, tier: inference }
      - targets: [crawler:8000]
        labels: { service: crawler, tier: ingest }
      - targets: [enricher:8000]
        labels: { service: enricher, tier: ingest }
      - targets: [fitment:8000]
        labels: { service: fitment, tier: resolve }
      - targets: [matcher:8000]
        labels: { service: matcher, tier: resolve }
      - targets: [catalog:8000]
        labels: { service: catalog, tier: serve }
      - targets: [search:8000]
        labels: { service: search, tier: serve }
      - targets: [billing:8000]
        labels: { service: billing, tier: serve }
      - targets: [ops:8000]
        labels: { service: ops, tier: internal }

  - job_name: yadakchi-web
    metrics_path: /api/metrics
    static_configs:
      - targets: [web:3000]
        labels: { service: web, tier: public }

  # Kafka consumer lag and topic offsets — the health of the whole pipeline.
  - job_name: kafka
    metrics_path: /metrics
    static_configs:
      - targets: [kafka-exporter:9308]
        labels: { component: kafka }

  # MinIO publishes Prometheus metrics natively; auth is public on the internal
  # network only (MINIO_PROMETHEUS_AUTH_TYPE=public).
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
        labels: { component: minio }

  # Typesense is deliberately absent: it exposes /metrics.json — JSON, behind
  # the admin API key — which Prometheus cannot scrape directly. `search` owns
  # Typesense and surfaces index health through its own /metrics instead.
  # Postgres and Redis likewise need their own exporters; add them here when
  # the load justifies the containers.
