# ===========================================================================
# yadakchi — PostgreSQL 16 tuning
#
# Target: one Postgres container, mem_limit 24g, on a 64–128 GB host, serving
# eight independent service databases (crawler, enricher, fitment, matcher,
# catalog, search, billing, ops), each with a Django connection pool plus
# Celery workers and Kafka consumer processes.
#
# Numbers below are sized against the CONTAINER limit (24 GB), not the host,
# because the cgroup is the real ceiling. Raise them together with mem_limit
# in platform/docker-compose.infra.yml if you move to a 128 GB host.
#
# Mounted read-only and selected with -c config_file=... (see the infra
# compose file), which is why the connection basics are repeated here.
# ===========================================================================

listen_addresses = '*'
port = 5432

# --- connections -----------------------------------------------------------
# 8 services x (web workers + celery + kafka consumers) + migrations + humans.
# Django's CONN_MAX_AGE keeps these persistent, so headroom matters more than
# tightness. work_mem below is sized for this number.
max_connections = 200
superuser_reserved_connections = 5

# --- memory ----------------------------------------------------------------
shared_buffers = 6GB                 # 25% of the 24 GB container
effective_cache_size = 16GB          # planner hint: OS cache + shared_buffers
work_mem = 24MB                      # per sort/hash node; 200 conns worst case
maintenance_work_mem = 1GB           # index builds, VACUUM, pgvector indexes
autovacuum_work_mem = 512MB
temp_buffers = 32MB
huge_pages = try

# --- write-ahead log -------------------------------------------------------
wal_level = replica
max_wal_size = 8GB                   # bulk reprocessing writes in large bursts
min_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_compression = on
synchronous_commit = on

# --- planner / storage -----------------------------------------------------
random_page_cost = 1.1               # SSD
effective_io_concurrency = 200       # SSD
default_statistics_target = 200      # wide, skewed spare-parts text columns

# --- parallelism -----------------------------------------------------------
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- autovacuum ------------------------------------------------------------
# Offer/price tables churn constantly (re-crawls update the same rows), so
# vacuum earlier and harder than the defaults.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

# --- observability ---------------------------------------------------------
log_destination = 'stderr'
logging_collector = off              # container stdout is the log pipeline
log_min_duration_statement = 500ms
log_checkpoints = on
log_connections = on                 # cheap proof of who connects where
log_disconnections = off
log_lock_waits = on
log_temp_files = 8MB
log_line_prefix = '%m [%p] %q%u@%d '
track_io_timing = on
track_functions = pl
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

# --- locale / time ---------------------------------------------------------
# Storage is UTC everywhere; Tehran time is a display concern only.
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.simple'
